[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MouseForge - onboard mouse profile editor"

[lib]
name = "mouseforge_app"
path = "src/lib.rs"

[[bin]]
name = "mouseforge"
path = "src/main.rs"

[dependencies]
hidpp = { path = "../hidpp" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
# Serve the built frontend (ui/dist) instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Services", "Win32_Foundation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
