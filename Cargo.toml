[workspace]
resolver = "2"
members = ["crates/hidpp", "crates/cli", "crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hidapi = "2"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
panic = "abort"
